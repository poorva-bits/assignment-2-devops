apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignment-2-devops-rolling
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: assignment-2-devops-rolling
  template:
    metadata:
      labels:
        app: assignment-2-devops-rolling
    spec:
      containers:
        - name: assignment-2-devops
          image: poorvaramnani/assignment-2-devops:2.1
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: assignment-2-devops-rolling
spec:
  type: NodePort
  selector:
    app: assignment-2-devops-rolling
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30081
