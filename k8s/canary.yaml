apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignment-2-devops-canary-stable
spec:
  replicas: 4
  selector:
    matchLabels: {app: assignment-2-devops-canary, track: stable}
  template:
    metadata:
      labels: {app: assignment-2-devops-canary, track: stable}
    spec:
      containers:
        - name: assignment-2-devops
          image: YOUR_DOCKERHUB_USER/assignment-2-devops-fitness:2.1
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignment-2-devops-canary-new
spec:
  replicas: 1
  selector:
    matchLabels: {app: assignment-2-devops-canary, track: canary}
  template:
    metadata:
      labels: {app: assignment-2-devops-canary, track: canary}
    spec:
      containers:
        - name: assignment-2-devops
          image: YOUR_DOCKERHUB_USER/assignment-2-devops-fitness:3.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: assignment-2-devops-canary
spec:
  type: NodePort
  selector:
    app: assignment-2-devops-canary      # matches BOTH tracks: traffic splits ~4:1 (20% canary)
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30083
