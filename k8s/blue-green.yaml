apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignment-2-devops-blue
spec:
  replicas: 2
  selector:
    matchLabels: {app: assignment-2-devops-bg, slot: blue}
  template:
    metadata:
      labels: {app: assignment-2-devops-bg, slot: blue}
    spec:
      containers:
        - name: assignment-2-devops
          image: poorvaramnani/assignment-2-devops:2.1
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignment-2-devops-green
spec:
  replicas: 2
  selector:
    matchLabels: {app: assignment-2-devops-bg, slot: green}
  template:
    metadata:
      labels: {app: assignment-2-devops-bg, slot: green}
    spec:
      containers:
        - name: assignment-2-devops
          image: poorvaramnani/assignment-2-devops:3.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: assignment-2-devops-bg
spec:
  type: NodePort
  selector:
    app: assignment-2-devops-bg
    slot: blue          # switch to "green" to cut over, back to "blue" to roll back
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30082
